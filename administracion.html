<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración AYN</title><link rel="stylesheet" href="/administracion.css"><link rel="stylesheet" href="/panic.css"></head><body><main><a href="/">Volver a AYN Control</a><h1 id="title">Administración AYN</h1><p id="message" role="status" aria-live="polite"></p><form id="access"><label>PIN de acceso<input id="pin" type="password" autocomplete="off" required></label><button>Entrar</button></form><nav id="tabs" hidden><button data-tab="people">Administradores y usuarios</button><button data-tab="equipment">Actuadores</button></nav><label id="groupLabel" hidden>Administración<select id="group"></select></label><section id="people" hidden><h2>Crear acceso</h2><form id="invite"><label>Tipo de acceso<select id="role"><option value="user">Usuario</option><option value="admin">Administrador</option></select></label><label>Nombre<input id="name" maxlength="60" required></label><label>Teléfono<input id="phone" type="tel" required></label><label>Departamento (opcional)<input id="apartment" maxlength="30"></label><button>Crear invitación</button></form><div id="invitation" hidden><label>Enlace personal, válido por 24 horas<input id="inviteLink" readonly></label><button id="copy" type="button">Copiar enlace</button><p>Comparte este enlace con la persona indicada. Entrega el PIN por separado.</p></div><h2>Usuarios de esta administración</h2><div id="users"></div></section><section id="equipment" hidden><form id="add" hidden><h2>Agregar y asignar actuador</h2><p>El equipo debe estar vinculado al proyecto Tuya de AYN.</p><label>Nombre<input id="actuatorName" maxlength="60" required></label><label>ID del equipo Tuya<input id="deviceId" required></label><label>Canal ON/OFF<input id="channel" value="switch_1" required></label><label>Apagado automático, segundos (0 = manual)<input id="timer" type="number" min="0" max="86400" value="0" required></label><button>Agregar a la administración seleccionada</button></form><h2>Actuadores asignados</h2><button id="refresh" type="button">Actualizar estado</button><div id="actuators"></div></section></main><script src="/administracion.js" defer></script><script src="/panic.js?v=20261003-panic48" defer></script></body></html>
