<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AYN Control · Conserjería</title>
  <link rel="stylesheet" href="/conserjeria.css">
  <script src="/conserjeria.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">A<span>&amp;</span>N CONTROL</p><h1>Conserjería en vivo</h1><p id="community">Validando conexión…</p></div>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Conectando</span></div>
    </header>
    <section class="summary"><div>Últimos accesos visibles<strong id="total">—</strong></div><div>Última actualización<strong id="last">—</strong></div></section>
    <section aria-label="Movimientos"><h2>Movimientos de acceso</h2><div id="events" class="events"></div></section>
    <footer>Panel de supervisión solamente · No permite activar relés · Actualización aproximada cada 3 segundos</footer>
  </main>
</body>
</html>
