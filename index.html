<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2239">
  <title>Control de Relés A&N</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <img src="/icon.svg" alt="A&N">
      <div>
        <h1>Control de Relés A&N</h1>
        <p>Encendido y apagado remoto</p>
      </div>
    </header>

    <section class="panel">
      <div class="security">
        <label for="pin">PIN de acceso</label>
        <div class="pin-row">
          <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
          <button id="savePin" class="secondary">Guardar</button>
        </div>
      </div>

      <div id="message" class="message">Ingresa tu PIN para comenzar.</div>

      <div class="relay-grid">
        <article class="relay-card" data-relay="1">
          <div>
            <span class="relay-label">Relé 1</span>
            <strong id="state1">Sin conexión</strong>
          </div>
          <button class="power" data-relay="1" aria-label="Controlar relé 1">⏻</button>
        </article>

        <article class="relay-card" data-relay="2">
          <div>
            <span class="relay-label">Relé 2</span>
            <strong id="state2">Sin conexión</strong>
          </div>
          <button class="power" data-relay="2" aria-label="Controlar relé 2">⏻</button>
        </article>

        <article class="relay-card" data-relay="3">
          <div>
            <span class="relay-label">Relé 3</span>
            <strong id="state3">Sin conexión</strong>
          </div>
          <button class="power" data-relay="3" aria-label="Controlar relé 3">⏻</button>
        </article>
      </div>

      <button id="refresh" class="refresh">Actualizar estado</button>
    </section>

    <footer>Proyecto independiente · A&N</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
