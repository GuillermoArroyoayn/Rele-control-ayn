<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>AYN Control · Pase temporal</title>
  <link rel="stylesheet" href="/pase.css">
  <script src="/pase.js" defer></script>
</head>
<body>
  <main class="shell">
    <header><div class="brand">A<span>&amp;</span>N <small>CONTROL</small></div><p>PASE DIGITAL TEMPORAL</p></header>
    <section class="card" aria-labelledby="title">
      <div class="symbol" aria-hidden="true">🔑</div>
      <h1 id="title">Tu acceso temporal</h1>
      <p id="guest-name">Validando permiso…</p>
      <p id="expires" class="subtle"></p>
      <div id="actions" class="actions"></div>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="subtle foot">Este pase está asociado a un solo navegador. Consérvalo en tu WhatsApp y no lo compartas. Se desactiva automáticamente al vencer o si la administración lo revoca.</p>
    </section>
    <footer>AYN Control · Accesos autorizados</footer>
  </main>
</body>
</html>
